[project]
name = "furima-mcp"
version = "0.3.0"
description = "MCP server for Japanese second-hand marketplaces: search Mercari, Yahoo! Auctions, Yahoo! Flea Market and Rakuma, and check what things actually sell for."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "fxia0018" }]
keywords = ["mcp", "mercari", "yahoo-auctions", "rakuma", "japan", "price", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/fxia0018/furima-mcp"
Issues = "https://github.com/fxia0018/furima-mcp/issues"

[project.scripts]
furima-mcp = "furima_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real sites (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003"]


[tool.hatch.build.targets.sdist]
exclude = ["docs/"]
